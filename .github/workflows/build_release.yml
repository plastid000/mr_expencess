name: Build & Release MR Expense APK

on:
  push:
    tags:
      - 'v*' # শুধুমাত্র v1.0.1, v1.0.2 টাইপের ট্যাগ পুশ করলেই এটা রান করবে

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true 

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔥 Firebase Automation Start 🔥
      
      # ১. গুগলের অফিসিয়াল অ্যাকশন দিয়ে সিকিউর অথেনটিকেশন (নো ম্যানুয়াল ফাইল রাইটিং!)
      - name: Authenticate to Google/Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_CREDENTIALS }}'

      # ২. নোড ও ফায়ারবেস সিএলআই সেটআপ
      - name: Setup Node.js & Firebase CLI
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      # ৩. রিমোট কনফিগ আপডেট 
      - name: Update Firebase Remote Config
        run: |
          # ১. ট্যাগ থেকে 'v' রিমুভ করা (যেমন: v1.0.1 -> 1.0.1)
          CLEAN_VERSION=${GITHUB_REF_NAME#v}
          
          # ২. গিটহাব রিলিজের ডিরেক্ট ডাউনলোড লিংক জেনারেট করা
          APK_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk"

          # তোমার প্রজেক্ট আইডি
          PROJECT_ID="takay-khuda-metai"

          echo "Fetching current remote config..."
          firebase remoteconfig:get config.json --project $PROJECT_ID --non-interactive

          echo "Modifying config with latest version & apk url..."
          jq --arg ver "$CLEAN_VERSION" \
             --arg url "$APK_DOWNLOAD_URL" \
             '.parameters.latest_version.defaultValue.value = $ver | .parameters.apk_url.defaultValue.value = $url' \
             config.json > updated_config.json

          echo "Publishing to Firebase..."
          firebase remoteconfig:publish updated_config.json --project $PROJECT_ID --force --non-interactive