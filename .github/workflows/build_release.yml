name: Build & Release MR Expense APK

on:
  push:
    tags:
      - 'v*' # শুধুমাত্র v1.0.1, v1.0.2 টাইপের ট্যাগ পুশ করলেই এটা রান করবে

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # রিলিজ ক্রিয়েট করার পারমিশন

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # ক্যাশ অন থাকলে পরের বার বিল্ড ফাস্ট হবে

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}