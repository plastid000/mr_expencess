name: Build & Release MR Expense APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true 

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔥 Firebase Automation Start 🔥
      
      - name: Authenticate to Google/Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_CREDENTIALS }}'

      # ২. নোড ও ফায়ারবেস সিএলআই সেটআপ (Stable Method)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      # ৩. রিমোট কনফিগ আপডেট 
      - name: Update Firebase Remote Config
        run: |
          APK_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk"
          PROJECT_ID="takay-khuda-metai"
          CLEAN_VERSION=${GITHUB_REF_NAME#v}

          echo "Fetching current remote config..."
          # --debug ফ্ল্যাগ অ্যাড করা হলো এক্সাক্ট এরর ট্র্যাক করার জন্য
          firebase remoteconfig:get config.json --project $PROJECT_ID --non-interactive --debug

          echo "Modifying config with jq..."
          jq --arg ver "$CLEAN_VERSION" \
             --arg url "$APK_DOWNLOAD_URL" \
             '.parameters.latest_version.defaultValue.value = $ver | .parameters.apk_url.defaultValue.value = $url' \
             config.json > updated_config.json

          echo "Publishing to Firebase..."
          firebase remoteconfig:publish updated_config.json --project $PROJECT_ID --force --non-interactive --debug