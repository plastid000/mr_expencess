name: Build & Release MR Expense APK

on:
  push:
    tags:
      - 'v*' # শুধুমাত্র v1.0.1, v1.0.2 টাইপের ট্যাগ পুশ করলেই এটা রান করবে

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # রিলিজ ক্রিয়েট করার পারমিশন

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # ক্যাশ অন থাকলে পরের বার বিল্ড ফাস্ট হবে

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔥 Firebase Automation Start 🔥
      - name: Setup Node.js & Firebase CLI
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Update Firebase Remote Config
        env:
          # সিক্রেটকে সরাসরি Bash-এ না দিয়ে Environment Variable হিসেবে পাস করা হলো
          FIREBASE_AUTH_KEY: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          echo "Generating Firebase Auth JSON..."
          # JSON ফরম্যাট ঠিক রাখার জন্য ডাবল-কোটেশন দিয়ে রাইট করা হলো
          echo "$FIREBASE_AUTH_KEY" > firebase_auth.json
          
          # PWD এর বদলে গিটহাবের ডিফল্ট ওয়ার্কস্পেস পাথ ব্যবহার করা বেশি সিকিউর
          export GOOGLE_APPLICATION_CREDENTIALS="${GITHUB_WORKSPACE}/firebase_auth.json"

          # ১. ট্যাগ থেকে 'v' রিমুভ করা (যেমন: v1.0.1 -> 1.0.1)
          CLEAN_VERSION=${GITHUB_REF_NAME#v}
          
          # ২. গিটহাব রিলিজের ডিরেক্ট ডাউনলোড লিংক জেনারেট করা
          APK_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk"

          PROJECT_ID="takay-khuda-metai"

          echo "Fetching current remote config..."
          # --debug ফ্ল্যাগ দেওয়া হলো যাতে কোনো এরর আসলে রুট কজ বের করা যায়
          firebase remoteconfig:get config.json --project $PROJECT_ID --non-interactive --debug

          echo "Modifying config with latest version & apk url..."
          jq --arg ver "$CLEAN_VERSION" \
             --arg url "$APK_DOWNLOAD_URL" \
             '.parameters.latest_version.defaultValue.value = $ver | .parameters.apk_url.defaultValue.value = $url' \
             config.json > updated_config.json

          echo "Publishing to Firebase..."
          firebase remoteconfig:publish updated_config.json --project $PROJECT_ID --force --non-interactive
          
          # সিকিউরিটির জন্য কাজ শেষে ফাইলগুলো ডিলিট
          rm firebase_auth.json config.json updated_config.json